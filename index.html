function initialState() {
  return {
    view: 'map', query: '', sel: null, asked: {}, toast: '',
    chats: seedChats(), cur: 'c1', draft: '', newTopic: '', sharePanel: false,
    extraTopics: [], arrived: [], queueIdx: 0, motion: true,
    feed: [
      { owner: 'jun', text: 'added “Interviews with five new users” to Onboarding' },

function lowerFirst(t) { return t ? t.charAt(0).toLowerCase() + t.slice(1) : t; }
function words(t) {
  return (t || '').toLowerCase().replace(/[^a-z\s]/g, ' ').split(/\s+/).filter(function (w) { return w.length > 4 && STOP.indexOf(' ' + w + ' ') < 0; });
}
function detectTopic(text, topics) {
  var t = (text || '').toLowerCase();
  for (var i = 0; i < topics.length; i++) {
    var ws = topics[i].words || [topics[i].label.toLowerCase()];
    for (var j = 0; j < ws.length; j++) if (t.indexOf(ws[j]) >= 0) return topics[i].id;
  }
  return null;
}
function makeReply(q, n) {
  var t = q.toLowerCase();
  if (t.indexOf('checklist') >= 0 || t.indexOf('list') >= 0) return 'A short list to start from: the one thing that blocks people most, the one person to ask, and the one task that proves it worked.';
  if (t.indexOf('shorter') >= 0 || t.indexOf('simpler') >= 0) return 'Cut down to three points, each one sentence, ordered by what someone needs first.';
  if (t.indexOf('price') >= 0 || t.indexOf('pricing') >= 0 || t.indexOf('tier') >= 0) return 'Small teams mostly compare on seats and the free limit. Showing one example team per tier made the choice clearer in similar products.';
  if (t.indexOf('search') >= 0) return 'The confusing parts cluster around empty results and filters that reset. Both are fixable without changing ranking.';
  if (t.indexOf('new hire') >= 0 || t.indexOf('onboard') >= 0 || t.indexOf('first week') >= 0) return 'Most first-week questions are about tools, people and expectations. Tools questions come first, then who to ask.';
  if (t.indexOf('why') >= 0) return 'Three likely reasons: it was never written down, it changed recently, or it lives in someone’s head. Worth checking which before fixing.';
  var opts = [
    'Three ways to look at it: start from what people already do, test the riskiest part first, and keep one version simple enough to share.',
    'Here is a first pass with two options. The first is quicker to try, the second is closer to what you described.',
    'Grouped into three themes. The middle one has the most open questions, so it might be the one to branch on.'
  ];
  return opts[n % opts.length];
}

class App extends Component {
  constructor(props) {
    super(props);
    this.state = initialState();
    this.sim = {};
    this.drag = null;
    this.suppress = false;
    this.tick = 0;
  }
  componentDidMount() {
    var self = this;
    try { if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) this.setState({ motion: false }); } catch (e) {}
    this.timer = setInterval(function () {
      if (self.state.view !== 'map') return;
      self.step();
      self.forceUpdate();
    }, 33);
  }
  componentWillUnmount() { clearInterval(this.timer); clearTimeout(this.replyTimer); }

  topics() { return BASE_TOPICS.concat(this.state.extraTopics); }
  topicById(id) { return this.topics().filter(function (t) { return t.id === id; })[0]; }
  curChat() { var s = this.state; return s.chats.filter(function (c) { return c.id === s.cur; })[0]; }
  sharedNodes(c) { return c.nodes.filter(function (n) { return n.shared && n.a; }); }
  draftSummary(c) {
    var sh = this.sharedNodes(c);
    if (!sh.length) return '';
    var first = sh[0].a.split('. ')[0];
    var last = sh.length > 1 ? sh[sh.length - 1].a.split('. ')[0] : '';
    return 'Exploring ' + lowerFirst(c.title.replace(/[…?.!]+$/, '')) + '. ' + first + (first.slice(-1) === '.' ? '' : '.') + (last ? ' Latest: ' + lowerFirst(last) + (last.slice(-1) === '.' ? '' : '.') : '');
  }
  summaryOf(c) { return c.summaryEdited ? c.summary : this.draftSummary(c); }

  sessions() {
    var self = this, s = this.state;
    var list = TEAM.slice().concat(s.arrived);
    s.chats.forEach(function (c) {
      if (!c.onMap) return;
      var sh = self.sharedNodes(c);
      var kw = c.title + ' ' + sh.map(function (n) { return n.q + ' ' + n.a; }).join(' ');
      list.push({ id: 'mine-' + c.id, chatId: c.id, owner: 'you', topic: c.topic, branches: sh.length, title: c.title, summary: self.summaryOf(c), kw: kw, updated: 'Yours · live', mine: true, level: c.level });
    });
    return list;
  }
  hubTargets() {
    var ts = this.topics(), n = ts.length, out = {};
    ts.forEach(function (t, i) {
      var ang = -Math.PI * 3 / 4 + i * (Math.PI * 2 / n);
      out[t.id] = { x: CX + Math.cos(ang) * 245, y: CY + Math.sin(ang) * 210 };
    });
    return out;
  }
  dOf(it) { return Math.min(76, 34 + it.branches * 8); }
  ensureSim(list, targets) {
    var sim = this.sim, now = Date.now();
    Object.keys(targets).forEach(function (id) {
      if (!sim['hub-' + id]) sim['hub-' + id] = { x: CX + (targets[id].x - CX) * 0.2, y: CY + (targets[id].y - CY) * 0.2, vx: 0, vy: 0, born: now };
    });
    var alive = {};
    list.forEach(function (it, i) {
      alive[it.id] = 1;
      if (!sim[it.id]) {
        var h = sim['hub-' + it.topic] || { x: CX, y: CY };
        var a = (i * 2.399) % (Math.PI * 2);
        sim[it.id] = { x: h.x + Math.cos(a) * 30, y: h.y + Math.sin(a) * 30, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3, born: now };
      }
    });
    Object.keys(sim).forEach(function (k) { if (k.indexOf('hub-') !== 0 && !alive[k]) delete sim[k]; });
  }
  step() {
    var self = this, s = this.state;
    var list = this.sessions();
    var targets = this.hubTargets();
    this.ensureSim(list, targets);
    var sim = this.sim, motion = s.motion;
    this.tick++;
    Object.keys(targets).forEach(function (id) {
      var h = sim['hub-' + id], t = targets[id];
      h.vx += (t.x - h.x) * 0.02; h.vy += (t.y - h.y) * 0.02;
      if (motion) { h.vx += Math.sin(self.tick / 50 + id.length) * 0.05; h.vy += Math.cos(self.tick / 60 + id.length * 2) * 0.05; }
      h.vx *= 0.85; h.vy *= 0.85; h.x += h.vx; h.y += h.vy;
    });
    var dragId = this.drag && this.drag.moved ? this.drag.id : null;
    for (var i = 0; i < list.length; i++) {
      var a = list[i], pa = sim[a.id], h = sim['hub-' + a.topic];
      if (!pa) continue;
      var da = this.dOf(a);
      if (h) {
        var dx = pa.x - h.x, dy = pa.y - h.y, dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
        var rest = 72 + da / 2;
        var f = (dist - rest) * 0.012;
        pa.vx -= dx / dist * f; pa.vy -= dy / dist * f;
      }
      for (var j = i + 1; j < list.length; j++) {
        var b = list[j], pb = sim[b.id];
        if (!pb) continue;
        var ex = pb.x - pa.x, ey = pb.y - pa.y, d2 = Math.sqrt(ex * ex + ey * ey) || 0.01;
        var min = (da + this.dOf(b)) / 2 + 30;
        if (d2 < min) { var push = (min - d2) * 0.06; pa.vx -= ex / d2 * push; pa.vy -= ey / d2 * push; pb.vx += ex / d2 * push; pb.vy += ey / d2 * push; }
      }
      var avoid = [{ x: CX, y: CY, r: 95 }];
      Object.keys(targets).forEach(function (id) { var hh = sim['hub-' + id]; avoid.push({ x: hh.x, y: hh.y, r: 82 }); });
      avoid.forEach(function (o) {
        var ox = pa.x - o.x, oy = pa.y - o.y, od = Math.sqrt(ox * ox + oy * oy) || 0.01, m = o.r + da / 2 - 20;
        if (od < m) { var p = (m - od) * 0.08; pa.vx += ox / od * p; pa.vy += oy / od * p; }
      });
      if (motion) { pa.vx += (Math.random() - 0.5) * 0.22; pa.vy += (Math.random() - 0.5) * 0.22; }
    }
    list.forEach(function (it) {
      var p = sim[it.id]; if (!p) return;
      if (it.id === dragId) { p.vx = 0; p.vy = 0; return; }
      p.vx *= 0.86; p.vy *= 0.86; p.x += p.vx; p.y += p.vy;
      var r = self.dOf(it) / 2 + 6;
      p.x = Math.max(r, Math.min(W - r, p.x)); p.y = Math.max(r + 4, Math.min(H - r - 40, p.y));
    });
  }
  matches(it, q) {
    if (!q) return true;
    var t = this.topicById(it.topic);
    var hay = (it.title + ' ' + it.summary + ' ' + it.kw + ' ' + (t ? t.label : '') + ' ' + PEOPLE[it.owner].name).toLowerCase();
    return q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
  }
  updateChat(id, fn) {
    var chats = this.state.chats.map(function (c) { if (c.id !== id) return c; var n = Object.assign({}, c); fn(n); return n; });
    this.setState({ chats: chats });
  }
  autoLinks(list) {
    var out = [];
    list.forEach(function (m) {
      if (!m.mine) return;
      var mw = words(m.kw);
      var best = null, bestScore = 0, bestWord = '';
      list.forEach(function (o) {
        if (o.mine) return;
        var ow = words(o.kw + ' ' + o.title + ' ' + o.summary);
        var common = mw.filter(function (w, i) { return ow.indexOf(w) >= 0 && mw.indexOf(w) === i; });
        if (common.length > bestScore) { bestScore = common.length; best = o; bestWord = common.sort(function (x, y) { return y.length - x.length; })[0]; }
      });
      if (best && bestScore >= 1) out.push({ a: m.id, b: best.id, text: 'both: ' + bestWord });
    });
    return out;
  }

  renderVals() {
    var self = this, s = this.state;
    var q = (s.query || '').trim().toLowerCase();
    var all = this.sessions();
    var targets = this.hubTargets();
    this.ensureSim(all, targets);
    var sim = this.sim, now = Date.now();
    var topics = this.topics();
    var navBase = 'display: flex; align-items: center; gap: 10px; width: 100%; min-height: 42px; padding: 0 10px; border-radius: 10px; border: none; font-size: 14.5px; cursor: pointer; text-align: left; ';
    function personOf(it) { return PEOPLE[it.owner]; }
    function anon(it) { return it.mine && it.level === 1; }

    var bubbles = all.map(function (it) {
      var p = personOf(it), pos = sim[it.id];
      var grow = Math.min(1, (now - pos.born) / 450);
      var d = Math.round(self.dOf(it) * (0.3 + 0.7 * grow));
      var hit = self.matches(it, q), selected = s.sel === it.id;
      var col = anon(it) ? '#64748B' : p.color;
      return {
        left: (pos.x - d / 2).toFixed(1), top: (pos.y - d / 2).toFixed(1), d: d, fs: d > 50 ? 16 : 13,
        fill: col,
        border: '3px solid #FFFFFF',
        op: hit ? 1 : 0.16,
        shadow: selected ? '0 0 0 4px ' + col + '55, 0 0 0 9px ' + col + '22' : (it.mine ? '0 0 0 3px #0F172A' : 'none'),
        initial: anon(it) ? '?' : p.name.charAt(0),
        title: anon(it) ? 'Someone on the team' : it.title,
        labelLeft: (pos.x - 62).toFixed(1), labelTop: (pos.y + d / 2 + 4).toFixed(1),
        labelOp: hit ? (q || selected || d >= 50 || it.mine ? 1 : 0.85) : 0.12,
        aria: (anon(it) ? 'Someone' : p.name) + ': ' + it.title,
        down: function (e) {
          try { e.currentTarget.setPointerCapture(e.pointerId); } catch (er) {}
          self.drag = { id: it.id, sx: e.clientX, sy: e.clientY, moved: false };
        },
        click: function () {
          if (self.suppress) { self.suppress = false; return; }
          self.setState({ sel: it.id });
        }
      };
    });

    var lines = [];
    function seg(x1, y1, x2, y2, extra) {
      var dx = x2 - x1, dy = y2 - y1;
      var o = { x: x1.toFixed(1), y: y1.toFixed(1), len: Math.sqrt(dx * dx + dy * dy).toFixed(1), deg: (Math.atan2(dy, dx) * 180 / Math.PI).toFixed(2), w: 2, dash: 'solid', color: '#CBD5E1', op: 1 };
      for (var key in extra) o[key] = extra[key];
      return o;
    }
    var halos = [], hubs = [];
    topics.forEach(function (t) {
      var h = sim['hub-' + t.id];
      var inT = all.filter(function (it) { return it.topic === t.id; });
      var ppl = {};
      inT.forEach(function (it) { ppl[it.owner] = 1; });
      var n = Object.keys(ppl).length;
      var hit = !q || inT.some(function (it) { return self.matches(it, q); }) || t.label.toLowerCase().indexOf(q) >= 0;
      var hd = 120 + n * 42;
      halos.push({ left: (h.x - hd / 2).toFixed(1), top: (h.y - hd / 2).toFixed(1), d: hd, alpha: (0.035 + n * 0.028).toFixed(3) });
      lines.push(seg(CX, CY, h.x, h.y, { w: 3, color: '#0F172A', op: hit ? 0.5 : 0.12 }));
      hubs.push({
        left: (h.x - 66).toFixed(1), top: (h.y - 23).toFixed(1),
        label: t.label, meta: n + (n === 1 ? ' person' : ' people') + ' · ' + inT.length,
        border: (q && hit) ? '#0F766E' : '#0F172A', op: hit ? 1 : 0.4,
        pick: function () { self.setState({ query: t.label.toLowerCase(), sel: null }); }
      });
    });
    all.forEach(function (it) {
      var h = sim['hub-' + it.topic], p = sim[it.id];
      if (!h || !p) return;
      lines.push(seg(h.x, h.y, p.x, p.y, { w: 2, color: anon(it) ? '#64748B' : personOf(it).color, op: self.matches(it, q) ? 0.6 : 0.1 }));
    });
    var links = LINKS.concat(this.autoLinks(all));
    var byId = {};
    all.forEach(function (it) { byId[it.id] = it; });
    var linkLabels = [];
    links.forEach(function (l) {
      var a = byId[l.a], b = byId[l.b];
      if (!a || !b) return;
      var pa = sim[a.id], pb = sim[b.id];
      var on = self.matches(a, q) || self.matches(b, q);
      var picked = s.sel === l.a || s.sel === l.b;
      lines.push(seg(pa.x, pa.y, pb.x, pb.y, { w: 2, dash: 'dashed', color: picked ? '#0F172A' : '#64748B', op: on ? 0.85 : 0.12 }));
      linkLabels.push({ x: ((pa.x + pb.x) / 2).toFixed(1), y: ((pa.y + pb.y) / 2).toFixed(1), text: l.text, op: picked ? 1 : (on ? 0.9 : 0.12) });
    });

    var chipLabels = topics.slice(0, 4).map(function (t) { return t.label.toLowerCase(); });
    var chips = chipLabels.map(function (c) {
      var on = q === c;
      return {
        label: c,
        style: 'height: 46px; padding: 0 14px; border-radius: 12px; font-size: 13.5px; font-weight: 600; cursor: pointer; border: 1px solid ' + (on ? '#0F766E' : '#CBD5E1') + '; background: ' + (on ? '#F0FDFA' : '#FFFFFF') + '; color: ' + (on ? '#115E59' : '#334155'),
        pick: function () { self.setState({ query: on ? '' : c, sel: null }); }
      };
    });

    var selItem = byId[s.sel];
    var sel = {};
    if (selItem) {
      var p = personOf(selItem), t = this.topicById(selItem.topic), an = anon(selItem);
      var hideSummary = selItem.mine && selItem.level < 3;
      var related = [];
      links.forEach(function (l) {

          related.push({ title: anon(o) ? 'Someone on the team' : o.title, why: 'same topic', color: anon(o) ? '#64748B' : personOf(o).color, pick: function () { self.setState({ sel: o.id }); } });
        }
      });
      sel = {
        color: an ? '#64748B' : p.color, initial: an ? '?' : p.name.charAt(0),
        topicUpper: t ? t.label.toUpperCase() : '', topicLower: t ? t.label.toLowerCase() : '',
        title: selItem.title, ownerName: p.name,

    }

    });
    var topicRows = topics.map(function (t) {
      var inT = all.filter(function (it) { return it.topic === t.id; });
      var ppl = [];
      inT.forEach(function (it) { if (ppl.indexOf(it.owner) < 0) ppl.push(it.owner); });

    });

    var c = this.curChat() || s.chats[0];
    var shareCount = c ? this.sharedNodes(c).length : 0;
    var order = [];
    if (c) {
      (function walk(parent, depth) {
        c.nodes.filter(function (n) { return n.parent === parent; }).forEach(function (n) { order.push({ n: n, depth: depth }); walk(n.id, depth + 1); });
      })(null, 0);
    }
    var numberOf = {}, byNode = {};
    order.forEach(function (o, i) { numberOf[o.n.id] = i + 1; byNode[o.n.id] = o.n; });

    var deepest = function (id) { var k = kidsOf(id); return k.length ? deepest(k[k.length - 1].id) : id; };
    var activeId = c && c.nodes.length ? (c.active && byNode[c.active] ? c.active : c.nodes[c.nodes.length - 1].id) : null;
    var path = [];
    var cursor = activeId;
    while (cursor && byNode[cursor]) { path.unshift(byNode[cursor]); cursor = byNode[cursor].parent; }
    var onPath = {};
    path.forEach(function (n) { onPath[n.id] = 1; });
    var setActive = function (id) { self.updateChat(c.id, function (cc) { cc.active = id; }); };
    var reasonsFor = function (n) {

        var picked = n.reason === r;
        return { label: r, style: 'height: 30px; padding: 0 12px; border-radius: 15px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid ' + (picked ? '#0F172A' : '#CBD5E1') + '; background: ' + (picked ? '#0F172A' : '#FFFFFF') + '; color: ' + (picked ? '#FFFFFF' : '#334155'), pick: function () { self.updateChat(c.id, function (cc) { cc.nodes = cc.nodes.map(function (m) { return m.id === n.id ? Object.assign({}, m, { reason: r }) : m; }); }); } };
      });
    };
    var toggleFor = function (n) { var on = !!n.shared; return function () { self.updateChat(c.id, function (cc) { cc.nodes = cc.nodes.map(function (m) { return m.id === n.id ? Object.assign({}, m, { shared: !on, reason: on ? (m.reason || 'Not sure yet') : m.reason }) : m; }); }); }; };
    var short = function (t, n) { return t.length > n ? t.slice(0, n - 1) + '…' : t; };

      var alts = kidsOf(n.id).filter(function (k) { return !next || k.id !== next.id; }).map(function (k) { return { label: short(k.q, 40), pick: function () { setActive(deepest(k.id)); } }; });

                      <span style="font-size: 12px; color: #475569; font-weight: 500">Why it stays private:</span>
                      ${((m.reasons)||[]).map((r, $index)=>html`
                        <button onClick=${r.pick} style=${r.style}>${r.label}</button>
                      `)}
                    </div>
                  ` : null}
                  ${(m.hasAlt) ? html`
                    <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px 10px; border-radius: 12px; background: #F8FAFC; border: 1px dashed #CBD5E1">
                      <span style="font-size: 12px; color: #475569; font-weight: 600">Other branches from here:</span>
                      ${((m.alts)||[]).map((al, $index)=>html`
                        <button onClick=${al.pick} style="height: 30px; max-width: 260px; padding: 0 12px; border-radius: 15px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">${al.label}</button>
                      `)}
                    </div>
                  ` : null}
                </div>
              </div>
            </div>
          `)}
        </div>
      </div>
      <div style="padding: 10px 24px 18px 24px">
        <div style="max-width: 720px; margin: 0 auto">
          ${(v.showBranchBanner) ? html`
            <div style="display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: #115E59; background: #F0FDFA; border: 1px solid #99F6E4; border-radius: 12px; padding: 8px 12px; margin-bottom: 8px">
              <span style="flex: 1">${v.branchBanner}</span>
              <button onClick=${v.backToLatest} style="border: none; background: transparent; color: #0F766E; font-size: 12.5px; font-weight: 700; cursor: pointer; padding: 4px">Back to latest</button>
            </div>
          ` : null}
          <div style="display: flex; gap: 8px; align-items: center; border: 1px solid #CBD5E1; border-radius: 16px; padding: 6px 6px 6px 16px; background: #FFFFFF">
            <label for="composer" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message</label>
            <input id="composer" type="text" value=${v.draft} onInput=${v.onDraft} onKeyDown=${v.onDraftKey} placeholder="Message AI…" style="flex: 1; height: 44px; border: none; outline: none; font-size: 15px; color: #0F172A; background: transparent"/>
            <button onClick=${v.send} aria-label="Send" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: #0F172A; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
          </div>
          <div style="font-size: 11.5px; color: #64748B; margin-top: 6px; text-align: center">Private by default. Nothing reaches the team until you mark answers Shared.</div>
        </div>
      </div>
    </section>

    ${(v.sharePanel) ? html`
    <aside style="width: 340px; flex-shrink: 0; background: #FFFFFF; border-left: 1px solid #E2E8F0; padding: 24px 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; overflow-y: auto">
      <div style="display: flex; align-items: center"><div style="font-size: 11.5px; font-weight: 800; letter-spacing: 0.6px; color: #64748B">SHARE TO TEAM MAP</div><button onClick=${v.closeShare} aria-label="Close share panel" style="margin-left: auto; width: 36px; height: 36px; border-radius: 10px; border: 1px solid #E2E8F0; background: #FFFFFF; color: #334155; font-size: 18px; cursor: pointer">×</button></div><div style="font-size: 13px; color: #475569; line-height: 1.5; margin-top: -4px">Only answers marked Shared shape this bubble. The chat itself is never shown.</div>
      <div style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 14px; background: #F8FAFC; border: 1px solid #E2E8F0">
        <span style=${`width: ${v.previewD}px; height: ${v.previewD}px; border-radius: 50%; background: ${v.previewColor}; color: #FFFFFF; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0`}>${v.previewInitial}</span>
        <div style="min-width: 0">
          <div style="font-size: 11.5px; font-weight: 800; letter-spacing: 0.6px; color: #0F766E">${v.previewTopic}</div>
          <div style="font-size: 15px; font-weight: 700; line-height: 1.3">${v.previewTitle}</div>
          <div style="font-size: 12px; color: #475569; margin-top: 2px">${v.previewCount}</div>
        </div>
      </div>
      <div style="font-size: 13px; font-weight: 700; margin-top: 2px">Topic</div>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        ${((v.topicChoices)||[]).map((tc, $index)=>html`
          <button onClick=${tc.pick} style=${tc.style}>${tc.label}</button>
        `)}
      </div>
      <div style="display: flex; gap: 6px">
        <label for="newtopic" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">New topic name</label>
        <input id="newtopic" type="text" value=${v.newTopic} onInput=${v.onNewTopic} placeholder="Or name a new topic" style="flex: 1; height: 38px; border-radius: 10px; border: 1px solid #CBD5E1; padding: 0 12px; font-size: 13.5px; color: #0F172A"/>
        <button onClick=${v.addTopic} style="height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid #0F766E; background: #FFFFFF; color: #0F766E; font-size: 13px; font-weight: 700; cursor: pointer">Add</button>
      </div>
      <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 2px">
        <label for="summary" style="font-size: 13px; font-weight: 700">Summary</label>
        <button onClick=${v.redraft} style="border: none; background: transparent; color: #0F766E; font-size: 12.5px; font-weight: 700; cursor: pointer; padding: 6px 0">Redraft from shared</button>
      </div>
      <textarea id="summary" value=${v.summaryText} onInput=${v.onSummary} rows="4" style="border: 1px solid #CBD5E1; border-radius: 12px; padding: 11px 12px; font-size: 14px; line-height: 1.5; resize: none; color: #0F172A"></textarea>
      <div style="font-size: 12px; color: #475569; margin-top: -4px">${v.summaryHint}</div>
      <div style="font-size: 13px; font-weight: 700; margin-top: 2px">Show on the map</div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        ${((v.levels)||[]).map((l, $index)=>html`
          <button onClick=${l.pick} style=${l.style}><span style="font-weight: 700; font-size: 13.5px">${l.label}</span><span style="font-size: 12px; color: #475569">${l.desc}</span></button>
        `)}
      </div>
      ${(v.canAddHint) ? html`
        <div style="font-size: 12.5px; color: #9A3412; background: #FFF7ED; border-radius: 10px; padding: 10px 12px; line-height: 1.45">${v.addHint}</div>
      ` : null}
      <button onClick=${v.mapAction} style=${v.mapActionStyle}>${v.mapActionLabel}</button>
      ${(v.onMapNow) ? html`
        <button onClick=${v.viewOnMap} style="height: 40px; border-radius: 12px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #334155; font-size: 13.5px; font-weight: 600; cursor: pointer">See it on the map</button>
      ` : null}
    </aside>
    ` : null}
  </main>
  ` : null}

  ${(v.showToast) ? html`
    <div role="status" style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); background: #0F172A; color: #FFFFFF; border-radius: 14px; padding: 13px 18px; font-size: 14px; font-weight: 500; display: flex; gap: 14px; align-items: center">
      <span>${v.toast}</span>
      <button onClick=${v.hideToast} style="border: none; background: transparent; color: #99F6E4; font-size: 13.5px; font-weight: 700; cursor: pointer; padding: 6px">Dismiss</button>
    </div>
  ` : null}
</div>`;
};
const stage = document.getElementById('stage');
function fit() {
  const s = Math.min(window.innerWidth / 1440, window.innerHeight / 900);
  stage.style.transform = 'scale(' + s + ')';
  stage.style.width = '1440px'; stage.style.height = '900px';
  stage.style.marginLeft = Math.max(0, (window.innerWidth - 1440 * s) / 2) + 'px';
}
window.addEventListener('resize', fit); fit();
render(html`<${App} />`, stage);
</script>
</body>
</html>
